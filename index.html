<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5957">
<title>Budget</title>
<link rel="manifest" href="./manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
:root{
  --bg:#071120; --surface:#101a2b; --card:#0c1626; --line:#22304a; --line2:#1a2438;
  --ink:#e7eef7; --soft:#9bacc2; --muted:#71839d; --brand:#14b8a6; --brandText:#5eead4;
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#93c5fd;
}
body.light{
  --bg:#f5f7fb; --surface:#fff; --card:#f8fafc; --line:#dbe4f0; --line2:#e9eef6;
  --ink:#0f172a; --soft:#334155; --muted:#475569;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px}
button,input,select{font-family:inherit}
input[type="date"]{color-scheme:dark}
body.light input[type="date"]{color-scheme:light}

.dw-topbar{height:58px;background:linear-gradient(100deg,#06201f,#0b5957 55%,#0e7a78);
  display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20}
body.light .dw-topbar{background:linear-gradient(100deg,#e6fffb,#b8f3ea 55%,#74e0d2)}
.dw-brand{font-weight:850;font-size:17px;color:#fff;display:flex;gap:9px;align-items:center;white-space:nowrap}
body.light .dw-brand{color:#063b39}
.dw-brand i{width:28px;height:28px;border-radius:9px;background:#5eead4;color:#062423;
  display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px}
.dw-nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.dw-nav::-webkit-scrollbar{display:none}
.dw-nav button{color:#bfe6e4;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;
  font-weight:700;font-size:13px;border:0;background:transparent}
.dw-nav button.active{background:rgba(255,255,255,.15);color:#fff}
body.light .dw-nav button{color:#0f766e}
body.light .dw-nav button.active{color:#063b39;background:rgba(255,255,255,.6)}
.dw-topicon{width:34px;height:34px;border:0;background:rgba(255,255,255,.13);color:#ecfeff;
  border-radius:10px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:15px}
body.light .dw-topicon{background:rgba(255,255,255,.85);color:#0f172a}
.dw-fileinfo{color:#d7fff6;font-size:11.5px;white-space:nowrap}
body.light .dw-fileinfo{color:#0f766e}
.dw-drive-status{color:#d7fff6;font-size:10.5px;white-space:nowrap}
body.light .dw-drive-status{color:#0f766e}
@media(max-width:640px){.dw-drive-status{display:none}.dw-topbar{gap:8px;padding:0 10px}}

.dw-monthrow{display:flex;align-items:center;gap:6px;padding:12px 18px;overflow-x:auto;
  border-bottom:1px solid var(--line2);max-width:1300px;margin:0 auto}
.dw-monthrow button{height:32px;border-radius:10px;background:#081426;color:#95c2ff;border:1px solid #102342;
  padding:0 13px;font-weight:800;cursor:pointer;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.dw-monthrow button.active{color:#071120;background:#5eead4;border-color:#5eead4}
body.light .dw-monthrow button{background:#f1f5f9;color:#0f766e;border-color:#cbd5e1}
body.light .dw-monthrow button.active{color:#062423;background:#5eead4;border-color:#5eead4}

.dw-wrap{max-width:1300px;margin:auto;padding:20px 18px 56px}
.dw-h1{font-size:22px;margin:0 0 4px}
.dw-sub{color:var(--soft);font-size:13px;margin:0 0 16px}

.dw-btn{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:0 13px;border-radius:11px;border:1px solid rgba(96,125,166,.42);background:#0b1528;
  color:#bcd7ff;font-weight:800;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dw-btn:hover{border-color:rgba(125,160,210,.65);color:#fff;background:#101d34}
body.light .dw-btn{background:#fff;color:#27466f;border-color:#cbd5e1}
body.light .dw-btn:hover{background:#eef2f7}
.dw-btn.primary{border:0;color:#ecfeff;background:linear-gradient(135deg,#10d5bd,#13c6b4 46%,#14b8a6);
  box-shadow:0 10px 22px rgba(20,184,166,.25)}
.dw-btn:disabled{opacity:.45;cursor:default}
.dw-btn.small{height:30px;font-size:11.5px;padding:0 10px}

.dw-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 18px}
.dw-stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:640px){.dw-stats{grid-template-columns:repeat(2,1fr)}}
.dw-kpi{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 11px;min-height:70px}
.dw-kpi .lbl{display:block;text-transform:uppercase;font-size:9.5px;font-weight:900;color:#8fb5e8;letter-spacing:.3px}
body.light .dw-kpi .lbl{color:#0f766e}
.dw-kpi .val{display:block;margin-top:6px;font-size:18px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.dw-kpi .delta{font-size:10px;font-weight:800;margin-top:2px;display:block}

.dw-grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.dw-grid2{grid-template-columns:1fr 1.3fr}}

.dw-panel{border-radius:18px;background:linear-gradient(180deg,rgba(16,26,43,.96),rgba(12,22,38,.98));
  border:1px solid rgba(80,109,154,.34);overflow:hidden;margin-bottom:14px}
body.light .dw-panel{background:#fff;box-shadow:0 8px 22px rgba(15,23,42,.08);border-color:#dbe4f0}
.dw-ph{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.dw-ph b{font-size:13.5px}
.dw-pbody{padding:14px 16px}

.dw-legend{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px;color:var(--muted)}
.dw-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

.dw-tablewrap{overflow-x:auto;padding:0 6px 6px}
.dw-scrolllist{max-height:360px;overflow:auto}
.dw-scrolllist .dw-tablewrap{max-height:360px}
table.dw-table{min-width:640px;border-collapse:collapse;width:100%}
table.dw-table th{height:34px;text-align:left;color:#6f89b2;font-size:10px;font-weight:900;
  text-transform:uppercase;padding:0 12px;border-bottom:1px solid rgba(80,109,154,.34);letter-spacing:.3px}
body.light table.dw-table th{color:#64748b}
table.dw-table td{padding:8px 12px;border-bottom:1px solid rgba(80,109,154,.18);vertical-align:middle}
table.dw-table tbody tr:hover td{background:linear-gradient(90deg,rgba(20,184,166,.10),rgba(96,165,250,.05))}
body.light table.dw-table tbody tr:hover td{background:#f0fdfa}
table.dw-table.compact th{height:26px;font-size:9.5px;padding:0 10px}
table.dw-table.compact td{padding:3px 10px}
table.dw-table.compact .dw-cell{padding:3px 5px;font-size:12.5px}
table.dw-table.compact .dw-badge{height:19px;font-size:10px;padding:0 7px}
table.dw-table.compact .dw-icobtn{width:24px;height:24px}

.dw-subtabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line2)}
.dw-subtabs button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;
  padding:9px 4px;margin-right:18px;border-bottom:2px solid transparent;cursor:pointer}
.dw-subtabs button.active{color:var(--brandText);border-bottom-color:var(--brand)}
body.light .dw-subtabs button.active{color:#0f766e}
.dw-accordion-header{cursor:pointer;user-select:none}
.dw-accordion-header:hover{background:rgba(255,255,255,.02)}
.dw-chevron{display:inline-block;font-size:15px;color:var(--muted);transition:transform .15s ease;font-style:normal}
.dw-delta-pos{color:var(--red)}
.dw-delta-neg{color:var(--green)}

.dw-cell{background:transparent;border:1px solid transparent;color:var(--ink);border-radius:8px;
  padding:6px 7px;font-size:13px;width:100%;font-family:inherit;font-variant-numeric:tabular-nums}
.dw-cell:hover{border-color:var(--line)}
.dw-cell:focus{outline:none;border-color:var(--brand);background:var(--card)}
.dw-cell.boxed{border:1px solid var(--line)}
select.dw-cell.boxed{appearance:auto}

.dw-badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 9px;
  font-size:10.5px;font-weight:850}
.dw-badge.blue{background:rgba(59,130,246,.18);color:var(--blue)}
.dw-badge.amber{background:rgba(245,158,11,.18);color:var(--amber)}
.dw-badge.teal{background:rgba(20,184,166,.18);color:var(--brandText)}
.dw-badge.red{background:rgba(248,113,113,.18);color:var(--red)}
.dw-badge.gray{background:var(--card);color:var(--muted);border:1px solid var(--line)}

.dw-icobtn{width:30px;height:30px;border-radius:9px;background:#081528;border:1px solid #263a5d;
  color:#bcd7ff;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
body.light .dw-icobtn{background:#f1f5f9;border-color:#cbd5e1;color:#475569}

.dw-progtrack{height:7px;border-radius:999px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.dw-progfill{height:100%;border-radius:999px}

.dw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;
  justify-content:center;z-index:50;padding:16px;overflow-y:auto}
.dw-overlay.show{display:flex}
.dw-modal{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin:auto}
.dw-field{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.dw-field span{display:block;margin-bottom:5px}
.dw-drive-credential{border-color:#60a5fa!important;box-shadow:inset 3px 0 #60a5fa}
.dw-drive-howto-step{padding:11px 12px;margin:9px 0;border:1px solid var(--line);border-left:4px solid #60a5fa;border-radius:10px;background:var(--card)}
.dw-drive-howto-step:nth-of-type(even){border-left-color:#34d399}
.dw-drive-howto-step h3{font-size:13px;margin:0 0 5px;color:var(--ink)}
.dw-drive-howto-step p{font-size:12px;line-height:1.5;margin:0;color:var(--muted)}
.dw-check{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.dw-toast{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 15px;z-index:80;font-size:13px;box-shadow:0 16px 34px rgba(0,0,0,.35);
  color:var(--ink);display:none;align-items:center;gap:10px;max-width:340px}
.dw-toast.show{display:flex}
.dw-empty{text-align:center;padding:40px 16px;color:var(--muted)}
.dw-empty .dw-btn{margin-top:14px}
.dw-inlinelist{display:flex;flex-direction:column;gap:8px}
.dw-inlinerow{display:flex;align-items:center;gap:8px}
.dw-inlinerow .dw-cell{flex:1}
.dw-month-actions{position:relative}
.dw-month-actions>summary{list-style:none;cursor:pointer}
.dw-month-actions>summary::-webkit-details-marker{display:none}
.dw-month-menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:150px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.dw-month-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:0;border-radius:7px;background:transparent;color:var(--red);font:inherit;text-align:left;cursor:pointer}
.dw-month-menu button:hover{background:rgba(248,113,113,.12)}
.dw-month-menu button span{color:var(--red)}
.dw-record-toggle{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:inherit}
.dw-record-total{font-size:11.5px;white-space:normal;font-variant-numeric:tabular-nums}
.dw-actual-control{display:flex;align-items:center;gap:5px}
.dw-actual-control .dw-cell{min-width:0}
.dw-match-budget{height:28px;min-width:28px;padding:0 7px;font-size:12px}
.dw-modal-close{background:none;border:0;color:var(--blue);cursor:pointer;font-size:18px;font-weight:800;width:30px;height:30px;border-radius:8px}
.dw-modal-close:hover{background:rgba(147,197,253,.12);color:#dbeafe}
.dw-grouptitle{font-weight:700;font-size:13px;margin:14px 0 8px}
.dw-grouptitle:first-child{margin-top:0}
.muted{color:var(--muted)}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="dw-topbar">
  <div class="dw-brand"><i>€</i><span id="brandText">Budget</span></div>
  <nav class="dw-nav" id="pageNav">
    <button data-page="dashboard" class="active" id="navDashboard">Dashboard</button>
    <button data-page="despesas" id="navDespesas">Expenses</button>
    <button data-page="config" id="navConfig">Settings</button>
  </nav>
  <span class="dw-fileinfo" id="fileInfo">no file linked</span>
  <button class="dw-btn small" id="btnReconnect" style="display:none"></button>
  <input id="fileInputFallback" type="file" accept=".xlsx,.xls" style="display:none">
  <button class="dw-topicon" id="btnConnect" title="Link an Excel file">⇪</button>
  <button class="dw-topicon" id="btnSave" title="Save to Excel">💾</button>
  <button class="dw-topicon" id="btnDriveSync" title="Sync with Google Drive" aria-label="Sync with Google Drive">☁</button>
  <span class="dw-drive-status" id="driveSyncStatus" aria-live="polite"></span>
  <button class="dw-topicon" id="btnLang" title="Mudar para português" style="font-size:12px;font-weight:800">EN</button>
  <button class="dw-topicon" id="btnTheme" title="Toggle theme">☀</button>
</header>
<div class="dw-monthrow" id="monthRow"></div>

<main class="dw-wrap">
  <div id="page-dashboard"></div>
  <div id="page-despesas" class="hidden"></div>
  <div id="page-config" class="hidden"></div>
</main>

<div class="dw-overlay" id="overlay"><div class="dw-modal" id="modalContent"></div></div>
<div class="dw-toast" id="toast"><span id="toastText"></span></div>

<script>
/* ============================================================ constantes ============================================================ */
const NATURES = ['Despesa','Rendimento','Poupança','Dívida'];
const NATURE_BADGE = {Despesa:'amber',Rendimento:'teal',Poupança:'blue',Dívida:'red'};
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => (typeof v === 'number' && !Number.isNaN(v)) ? v : (parseFloat(v) || 0);
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const dateParts = value => {
  if(!value) return null;
  if(value instanceof Date && !Number.isNaN(value.getTime())) return [value.getFullYear(),value.getMonth()+1,value.getDate()];
  const s = String(value).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return [Number(m[1]),Number(m[2]),Number(m[3])];
  m = s.match(/^(\d{1,2})[\/.-]([A-Za-z]{3}|\d{1,2})[\/.-](\d{4})$/);
  if(m){
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const month = /^\d+$/.test(m[2]) ? Number(m[2]) : months.indexOf(m[2].toLowerCase())+1;
    return month>=1 && month<=12 ? [Number(m[3]),month,Number(m[1])] : null;
  }
  if(typeof value==='number' && value>0){
    const d = XLSX.SSF.parse_date_code(value);
    return d ? [d.y,d.m,d.d] : null;
  }
  return null;
};
const normalizeDate = value => {
  const p = dateParts(value);
  return p ? `${p[0]}-${String(p[1]).padStart(2,'0')}-${String(p[2]).padStart(2,'0')}` : todayISO();
};
const displayDate = value => {
  const p = dateParts(value);
  return p ? `${String(p[2]).padStart(2,'0')}/${MESES_EN[p[1]-1].slice(0,3)}/${p[0]}` : '';
};
const dateTimestamp = value => {
  const p = dateParts(value);
  return p ? new Date(p[0],p[1]-1,p[2]).getTime() : 0;
};
function monthStart(m){
  const label=String(m?.label||'');
  const lower=label.toLowerCase();
  let idx=MESES_EN.findIndex(x=>lower.includes(x.toLowerCase()));
  if(idx<0) idx=MESES_PT.findIndex(x=>lower.includes(x.toLowerCase()));
  if(idx<0){
    const abbreviations=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const match=lower.match(/\b([a-z]{3})\b/);
    if(match) idx=abbreviations.indexOf(match[1]);
  }
  const year=Number(label.match(/\d{4}/)?.[0]||m?.year||new Date().getFullYear());
  return idx>=0?`${year}-${String(idx+1).padStart(2,'0')}-01`:todayISO();
}
const fmtEUR = v => num(v).toLocaleString(ui.lang==='en'?'en-IE':'pt-PT',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ============================================================ i18n ============================================================ */
const I18N = {
  pt: {
    brand:'Orçamento', nav_dashboard:'Dashboard', nav_despesas:'Despesas', nav_config:'Configurações',
    file_none:'sem ficheiro ligado', file_compat:'modo compatibilidade (sem ligação direta)', file_linked:'ligado: ',
    btn_connect_title:'Ligar a um ficheiro Excel no computador', btn_save_title:'Guardar/descarregar Excel no computador — não guarda no Google Drive', btn_theme_title:'Alternar tema', btn_lang_title:'Switch to English',
    new_month:'+ Novo mês',

    dash_title:'Panorama geral',
    dash_sub:'Poupanças e investimentos — valores calculados até {m}, o mês mais recente.',
    dash_empty_title:'Sem dados ainda', dash_empty_sub:'Cria o primeiro mês (em Despesas) para veres aqui o teu panorama geral.', dash_empty_btn:'Ir para Despesas',
    kpi_available:'Dinheiro disponível', kpi_savings:'Total em poupanças', kpi_investments:'Total investido', kpi_debt:'Total em dívida',
    kpi_networth:'Património líquido', kpi_networth_sub:'poupanças + valor de mercado dos investimentos',
    panel_money:'Onde está o teu dinheiro', panel_accounts:'Poupanças e investimentos por conta',
    panel_debt_chart:'Dívidas — pago vs em falta',
    panel_savings:'Poupanças', panel_investments:'Investimentos',
    no_savings_investments:'Sem poupanças ou investimentos ainda.',
    no_savings2:'Sem poupanças ainda — cria em Configurações.',
    no_investments2:'Sem investimentos ainda — cria em Configurações e marca como Investimento.',
    lbl_available:'Disponível', lbl_savings:'Poupanças', lbl_investments:'Investimentos',
    lbl_paid:'Pago', lbl_missing:'Em falta', pct_paid:'% pago', lbl_to_goal:'Falta para a meta', pct_achieved:'% da meta',
    market_change:'Variação de mercado',

    resumo_kpi_balance:'Saldo atual', resumo_kpi_income:'Rendimento', resumo_kpi_spent:'Gasto em despesas',
    resumo_kpi_outside:'Fora da regra %', resumo_kpi_difference:'Rendimento − despesas', resumo_kpi_savings:'Poupança (real)',
    resumo_above:'acima do rendimento', resumo_within:'dentro do rendimento',
    panel_classification:'Classificação (regra %)', panel_budget_vs_real:'Orçamento vs real por classificação',
    panel_income_vs_spend:'Rendimento vs gasto por classificação', panel_balance_chart:'Saldo inicial vs atual',
    no_rule_classifications:'Sem classificações com regra % configuradas.',
    lbl_budget:'Orçamento', lbl_real:'Real', lbl_income:'Rendimento', lbl_slack:'Folga',
    lbl_starting_balance:'Saldo inicial', lbl_current_balance:'Saldo atual',

    despesas_sub:'Despesas, rendimento avulso, poupança e dívida deste mês.',
    tab_resumo:'Resumo', tab_registos:'Registos',
    despesas_empty_title:'Sem meses ainda', despesas_empty_sub:'Cria o primeiro mês para começares a registar despesas.', despesas_empty_btn:'Criar primeiro mês',
    rename_month_title:'Renomear mês', delete_month_title:'Apagar mês', delete_month_action:'Apagar mês', confirm_delete_month:'Apagar "{m}"? Esta ação não pode ser desfeita.',
    confirm_delete_record:'Apagar o registo "{name}" de {month}? Esta ação não pode ser desfeita.',
    nature_despesa:'Despesas', nature_rendimento:'Rendimento', nature_poupanca:'Poupança', nature_divida:'Dívida',
    records_count:' registo(s)',
    col_item:'Item', col_recurrence:'Recorrência', col_category:'Categoria', col_classification:'Classificação',
    col_budget:'Orçamento', col_real:'Real', col_delta:'Δ', col_savings:'Poupança', col_debt:'Dívida',

/* ============================================================ indexeddb: guardar o handle do ficheiro ============================================================ */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('orcamento-app-db', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){}
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}

function newMonthFrom(prevMonth, label, year){
  const classificationsSnapshot = STATE.classifications.map(c => ({...c}));
  const firstDay = monthStart({label,year});
  let bankBalanceNow = 0;
  const items = STATE.regulars.map(r=>{
    const previous=prevMonth?.items.find(it=>it.regularId===r.id);
    return {
      id:uid(), regularId:r.id, name:r.name, budget:num(r.budget), actual:0, nature:r.nature,
      category:r.category||null, classification:r.classification||null, refId:r.refId||null,
      recurring:true, date:firstDay, comment:previous?.comment||''
    };
  });
  const marketValues = {};
  if(!prevMonth) STATE.savings.forEach(s=>{
    if(s.kind==='Investimento'){
      const legacyValue=s.currentValue!=null?s.currentValue:s.target;
      if(legacyValue!=null) marketValues[s.id]=num(legacyValue);
    }
  });
  if(prevMonth){
    const t = computeMonthTotals(prevMonth);
    bankBalanceNow = Math.round(t.saldoAtual);
  }
  return {label, year, bankBalanceNow, items, classificationsSnapshot, marketValues};
}

/* ============================================================ cálculos ============================================================ */
function computeMonthTotals(m){
  const rendimentoItems = m.items.filter(it=>it.nature==='Rendimento');
  const incomeBudget = rendimentoItems.reduce((s,it)=>s+num(it.budget),0);
  const incomeActual = rendimentoItems.reduce((s,it)=>s+num(it.actual),0);
  const totalIncomeBudget = incomeBudget;
  const totalIncomeActual = incomeActual;

  const despesas = m.items.filter(it=>it.nature==='Despesa');
  const totalDespesasBudget = despesas.reduce((s,it)=>s+num(it.budget),0);
  const totalDespesasActual = despesas.reduce((s,it)=>s+num(it.actual),0);

  const byClass = {};
  (m.classificationsSnapshot||[]).forEach(c => byClass[c.name] = {target: c.targetPercent, counts: c.countsPercent, budget:0, real: 0});
  let outsideRule = 0;
  despesas.forEach(it=>{
    const cname = it.classification;
    if(cname && byClass[cname]){
      byClass[cname].budget += num(it.budget);
      byClass[cname].real += num(it.actual);
      if(!byClass[cname].counts) outsideRule += num(it.actual);
    } else {
      outsideRule += num(it.actual);
    }
  });
  // Only savings contributions participate in the classification rule; debt repayments are tracking-only.
  m.items.filter(it=>it.nature==='Poupança').forEach(it=>{
    const cname = it.classification;
    if(cname && byClass[cname]){ byClass[cname].budget += num(it.budget); byClass[cname].real += num(it.actual); }
  });

  const poupContrib = m.items.filter(it=>it.nature==='Poupança').reduce((s,it)=>s+num(it.actual),0);
  const dividaPag = m.items.filter(it=>it.nature==='Dívida').reduce((s,it)=>s+num(it.actual),0);
  const ruleClasses=Object.values(byClass).filter(c=>c.counts);
  const ruleBudgetTotal=ruleClasses.reduce((s,c)=>s+c.budget,0);
  const ruleActualTotal=ruleClasses.reduce((s,c)=>s+c.real,0);
  const budgetNotOnBudget=totalIncomeBudget-ruleBudgetTotal;
  const stillFree=totalIncomeActual-ruleActualTotal;

  const saldoAtual = num(m.bankBalanceNow) + totalIncomeActual - totalDespesasActual - poupContrib;

  return {
    totalIncome: totalIncomeActual, totalIncomeBudget, totalIncomeActual,
    incomeBudget, incomeActual,
    totalDespesas: totalDespesasActual, totalDespesasBudget, totalDespesasActual,
    byClass, outsideRule, poupContrib, dividaPag, saldoAtual,
    budgetNotOnBudget, stillFree,
  };
}

// Totais de Poupança/Dívida — calculados a partir de TODOS os registos de todos os
// meses (nunca guardados à parte), para nunca poderem desincronizar da soma real.
function computeEntityTotals(){
  const savTotals = {}; STATE.savings.forEach(s=>savTotals[s.id]=num(s.opening));
  const debtPaid = {}; STATE.debts.forEach(d=>debtPaid[d.id]=0);
  Object.values(STATE.months).forEach(m=>{
    m.items.forEach(it=>{
      if(it.nature==='Poupança' && it.refId && savTotals.hasOwnProperty(it.refId)) savTotals[it.refId] += num(it.actual);
      if(it.nature==='Dívida' && it.refId && debtPaid.hasOwnProperty(it.refId)) debtPaid[it.refId] += num(it.actual);
    });
  });
  return {savTotals, debtPaid};
}
function savingsTotal(id){ return computeEntityTotals().savTotals[id] || 0; }
function debtRemaining(d){ return num(d.initial) - (computeEntityTotals().debtPaid[d.id] || 0); }

async function driveRequest(url,options={}){
  const response=await fetch(url,{
    ...options,
    headers:{Authorization:`Bearer ${drive.token}`,...options.headers}
  });
  if(!response.ok){
    const detail=await response.text();
    throw new Error(`Drive API ${response.status}: ${detail.slice(0,300)}`);
  }
  return response;
}
async function getDriveFile(fileId){
  const response=await driveRequest(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?fields=id,name,mimeType,modifiedTime,version,webViewLink`);
  return response.json();
}
async function hashState(state){
  const bytes=new TextEncoder().encode(JSON.stringify(state));
  const digest=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
}
function saveDriveMeta(file,stateHash){
  drive.file=file;
  drive.meta={fileId:file.id,fileName:file.name,modifiedTime:file.modifiedTime,version:file.version,localHash:stateHash};
  storeDriveMeta();
  setDriveStatus(t('drive_synced'));
}
async function downloadDriveWorkbook(file){
  if(file.mimeType==='application/vnd.google-apps.spreadsheet') throw new Error(t('drive_native_sheet'));
  if(file.mimeType!==DRIVE_MIME&&file.mimeType!=='application/vnd.ms-excel'){
    throw new Error(`Unsupported Drive file type: ${file.mimeType}`);
  }
  const response=await driveRequest(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`);
  const workbook=XLSX.read(await response.arrayBuffer(),{type:'array'});
  drive.suppressAutosync=true;
  try{loadWorkbook(workbook);markClean();}
  finally{drive.suppressAutosync=false;}
  renderAll();
}
async function uploadDriveWorkbook(file){
  if(file.mimeType!=='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'&&file.mimeType!=='application/vnd.ms-excel'){
    throw new Error(`Unsupported Drive file type: ${file.mimeType}`);
  }
  const bytes=XLSX.write(buildWorkbook(),{type:'array',bookType:'xlsx'});
  const response=await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(file.id)}?uploadType=media&fields=id,name,mimeType,modifiedTime,version,webViewLink`,{
    method:'PATCH',
    headers:{'Content-Type':DRIVE_MIME},
    body:bytes
  });
  return response.json();
}

async function loadPickerLibrary(){

async function chooseDriveFile(){

async function requestDriveAuthorization(){
  if(!window.google?.accounts?.oauth2) throw new Error(t('drive_client_missing'));
  return new Promise((resolve,reject)=>{
    const tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:driveConfig.clientId,
      scope:DRIVE_SCOPE,
      callback:async response=>{
        if(response.error){reject(new Error(response.error_description||response.error));return;}
        drive.token=response.access_token;
        drive.tokenExpiresAt=Date.now()+Number(response.expires_in||3600)*1000;
        try{
          const profileResponse=await driveRequest('https://www.googleapis.com/oauth2/v3/userinfo');
          const profile=await profileResponse.json();
          activateDriveAccount(profile);
          resolve(profile);
        }catch(error){reject(error);}
      },
      error_callback:error=>reject(new Error(error.message||'Google authorization was cancelled.'))
    });
    tokenClient.requestAccessToken(drive.user?{prompt:'select_account'}:{});
  });
}
async function chooseAndLoadDriveFile(){
  const fileId=await chooseDriveFile();
  if(!fileId) return;
  const file=await getDriveFile(fileId);
  const prior=drive.meta;
  drive.file=file;
  if(prior?.fileId===file.id){await syncDrive(true);return;}
  const localState=stateHasData(STATE)?STATE:drive.unboundState;
  if(stateHasData(localState)){
    const choice=await openDriveChoiceModal(t('drive_initial_title'),t('drive_initial_message'),[
      {id:'local',label:t('drive_keep_local'),primary:true},
      {id:'remote',label:t('drive_use_remote')},
      {id:'cancel',label:t('drive_cancel')}
    ]);
    if(!choice||choice==='cancel'){drive.file=null;return;}
    if(choice==='local'){
      STATE=normalizeState(JSON.parse(JSON.stringify(localState)));
      saveLocal();
      const saved=await uploadDriveWorkbook(file);
      saveDriveMeta(saved,await hashState(STATE));
      drive.unboundState=null;
      renderAll();
      return;
    }
  }
  await downloadDriveWorkbook(file);
  saveDriveMeta(await getDriveFile(file.id),await hashState(STATE));
  drive.unboundState=null;
}
async function syncDrive(interactive){
  if(!drive.user) throw new Error(t('drive_not_connected'));
  if(!navigator.onLine){setDriveStatus(t('drive_offline'));return;}
  if(drive.busy) return;
  drive.busy=true;
  setDriveStatus(t('drive_syncing'));
  try{
    if(!drive.file){
      if(drive.meta?.fileId){
        drive.file=await getDriveFile(drive.meta.fileId);
        await syncDriveForCurrentFile(interactive);
      }else if(interactive){
        setDriveStatus(t('drive_selecting_file'));
        await chooseAndLoadDriveFile();
      }
      return;
    }
    await syncDriveForCurrentFile(interactive);
  }finally{drive.busy=false;}
}
async function syncDriveForCurrentFile(interactive){
  const remote=await getDriveFile(drive.file.id);
  if(remote.mimeType==='application/vnd.google-apps.spreadsheet') throw new Error(t('drive_native_sheet'));
  const localHash=await hashState(STATE);
  const previous=drive.meta;
  if(previous?.fileId===remote.id){
    const localChanged=localHash!==previous.localHash;
    const remoteChanged=String(remote.version)!==String(previous.version);
    if(localChanged&&remoteChanged){
      if(!interactive){setDriveStatus(t('drive_pending'));return;}
      const choice=await openDriveChoiceModal(t('drive_conflict_title'),t('drive_conflict_message'),[
        {id:'local',label:t('drive_keep_local'),primary:true},
        {id:'remote',label:t('drive_use_remote')},
        {id:'cancel',label:t('drive_cancel')}
      ]);
      if(choice==='local'){
        const saved=await uploadDriveWorkbook(remote);
        saveDriveMeta(saved,await hashState(STATE));
      }else if(choice==='remote'){
        await downloadDriveWorkbook(remote);
        saveDriveMeta(await getDriveFile(remote.id),await hashState(STATE));
      }else setDriveStatus(t('drive_pending'));
      return;
    }
    if(remoteChanged){
      await downloadDriveWorkbook(remote);
      saveDriveMeta(await getDriveFile(remote.id),await hashState(STATE));
    }else if(localChanged){
      const saved=await uploadDriveWorkbook(remote);
      saveDriveMeta(saved,await hashState(STATE));
    }else saveDriveMeta(remote,localHash);
    return;
  }
  if(stateHasData(STATE)){
    if(!interactive){setDriveStatus(t('drive_pending'));return;}
    const choice=await openDriveChoiceModal(t('drive_initial_title'),t('drive_initial_message'),[
      {id:'local',label:t('drive_keep_local'),primary:true},
      {id:'remote',label:t('drive_use_remote')},
      {id:'cancel',label:t('drive_cancel')}
    ]);
    if(choice==='local'){
      const saved=await uploadDriveWorkbook(remote);
      saveDriveMeta(saved,await hashState(STATE));
    }else if(choice==='remote'){
      await downloadDriveWorkbook(remote);
      saveDriveMeta(await getDriveFile(remote.id),await hashState(STATE));
    }else setDriveStatus(t('drive_pending'));
    return;
  }
  await downloadDriveWorkbook(remote);
  saveDriveMeta(await getDriveFile(remote.id),await hashState(STATE));
}

    const hasAnyTarget = entities.some(e=>e.target);
    const hasAnyMarketDelta=entities.some(e=>e.kind==='Investimento'&&e.showMarketValue&&e.currentMarket!=null);
    charts.dashEntities = new Chart($('dashEntities'), {
      type:'bar',
      data:{labels:entities.map(e=>e.name), datasets:[

          backgroundColor:entities.map(e=>e.kind==='Investimento'?'#c4b5fd':'#5eead4')},

        ...(hasAnyMarketDelta?[{label:t('market_value'),data:entities.map(e=>e.kind==='Investimento'&&e.showMarketValue&&e.currentMarket!=null?Math.round(e.currentMarket):null),
          backgroundColor:entities.map(e=>e.currentMarket!=null&&e.currentMarket<e.total?'#f87171':'#4ade80')}]:[])
      ]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
        scales:{x:{grid:{color:'rgba(80,109,154,.18)'}}, y:{grid:{display:false}}},
        plugins:{legend:{display:hasAnyTarget||hasAnyMarketDelta, position:'top', align:'end', labels:{boxWidth:10, boxHeight:10}},
          tooltip:{callbacks:{afterBody:(items)=>{
            const e = entities[items[0].dataIndex];
            const lines=[];
            if(e.target) lines.push(`${Math.round(Math.min(100,e.total/e.target*100))}${t('pct_achieved')}`);
            if(e.kind==='Investimento'&&e.showMarketValue&&e.currentMarket!=null){
              const diff=e.currentMarket-e.total;
              const pct=e.total?diff/e.total*100:0;
              lines.push(`${t('market_change')}: ${diff>=0?'+':''}${fmtEUR(diff)} (${diff>=0?'+':''}${Math.round(pct)}%)`);
            }

            return lines;
          }}}}}
    });
  }

}

function renderSavingsStartingPointPanel(){
  if(!STATE.savings.length) return '';
  const {savTotals}=computeEntityTotals();
  const rows=STATE.savings.map(account=>{
    const added=STATE.order.reduce((sum,id)=>sum+STATE.months[id].items
      .filter(item=>item.nature==='Poupança'&&item.refId===account.id)
      .reduce((monthSum,item)=>monthSum+num(item.actual),0),0);
    const starting=num(account.opening);
    const investment=account.kind==='Investimento';
    const market=investment?latestMarketValue(account.id):null;
    const legacyCategory=account.kind==='Investimento'?'Investments':'Pocket Money';
    const category=account.category||(STATE.categories.includes(legacyCategory)?legacyCategory:'—');
    return `<tr>
      <td>${escapeHtml(kindLabel(account.kind))}</td>
      <td>${escapeHtml(account.name)}</td>
      <td>${escapeHtml(category)}</td>
      <td style="text-align:right">${fmtEUR(starting)}</td>
      <td style="text-align:right">${fmtEUR(added)}</td>
      <td style="text-align:right">${fmtEUR(savTotals[account.id]||0)}</td>
      <td style="text-align:right">${starting?`${(added/starting*100).toFixed(1)}%`:'—'}</td>
      <td style="text-align:right">${investment&&market?fmtEUR(market.value):'—'}</td>
    </tr>`;
  }).join('');
  return `<details class="dw-panel" data-saving-contributions>
    <summary class="dw-ph" style="cursor:pointer"><b>${t('panel_savings_investments')}</b><span class="muted">${t('saving_starting_point')} · ${t('saving_added')} · ${t('saving_ending')}</span></summary>
    <div class="dw-tablewrap"><table class="dw-table compact">
      <thead><tr><th>${t('regular_type')}</th><th>${t('regular_item')}</th><th>${t('field_category')}</th>
        <th style="text-align:right">${t('saving_starting_point')}</th><th style="text-align:right">${t('saving_added')}</th>
        <th style="text-align:right">${t('saving_ending')}</th><th style="text-align:right">${t('saving_change')}</th>
        <th style="text-align:right">${t('market_value')}</th>
      </tr></thead><tbody>${rows}</tbody>
    </table></div>
  </details>`;
}

  const classEntries = Object.entries(t1.byClass);
  const ruleEntries = classEntries.filter(([,v])=>v.counts);

  container.innerHTML = `
    <section class="dw-stats five">
      <div class="dw-kpi"><span class="lbl">${t('resumo_kpi_balance')}</span><span class="val">${fmtEUR(t1.saldoAtual)}</span></div>
      <div class="dw-kpi"><span class="lbl">${t('resumo_kpi_income')}</span><span class="val">${fmtEUR(t1.totalIncome)}</span></div>
      <div class="dw-kpi"><span class="lbl">${t('resumo_kpi_spent')}</span><span class="val">${fmtEUR(t1.totalDespesas)}</span>
        <span class="delta" style="color:${overBudget?'var(--red)':'var(--green)'}">${overBudget?t('resumo_above'):t('resumo_within')}</span>
      </div>
      <div class="dw-kpi"><span class="lbl">${t('resumo_kpi_difference')}</span><span class="val">${fmtEUR(incomeDifference)}</span></div>
      <div class="dw-kpi"><span class="lbl">${t('resumo_kpi_savings')}</span><span class="val">${fmtEUR(t1.poupContrib)}</span></div>
    </section>

    <div class="dw-grid2">
      <section class="dw-panel"><div class="dw-ph"><b>${t('panel_classification')}</b></div>
        <div class="dw-pbody">
          ${ruleEntries.length===0 ? `<p class="muted" style="font-size:12.5px">${t('no_rule_classifications')}</p>` : `
          <div class="dw-grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">
            <div style="min-width:0"><p class="muted" style="font-size:11.5px">${t('lbl_budget')}</p><div style="position:relative;width:100%;height:140px"><canvas id="chartBudgetDonut"></canvas></div><div class="dw-legend" id="budgetDonutLegend"></div></div>
            <div style="min-width:0"><p class="muted" style="font-size:11.5px">${t('lbl_real')}</p><div style="position:relative;width:100%;height:140px"><canvas id="chartDonut"></canvas></div><div class="dw-legend" id="donutLegend"></div></div>
          </div>`}
        </div>
      </section>
      <section class="dw-panel"><div class="dw-ph"><b>${t('panel_budget_vs_real')}</b></div>
        <div class="dw-pbody">
          ${ruleEntries.length===0 ? `<p class="muted" style="font-size:12.5px">${t('no_rule_classifications')}</p>` : `
          <div style="position:relative;width:100%;height:${Math.max(150, ruleEntries.length*44+60)}px"><canvas id="chartBudget"></canvas></div>`}
        </div>
      </section>
    </div>

    <section class="dw-panel"><div class="dw-ph"><b>${t('panel_income_vs_spend')}</b></div>
      <div class="dw-pbody">
        <div style="position:relative;width:100%;height:220px"><canvas id="chartIncomeVs"></canvas></div>
      </div>
    </section>
    ${renderMonthMarketValues(m)}
    ${renderRecordBrowser(recordsForMonth(m,m.label),'month-overview',true)}
    ${renderNotesPanel('month',STATE.active)}
  `;

  destroyCharts(['donut','budget','budgetDonut','incomeVs','classDonut','classBars','classIncomeVs']);
  const palette = ['#60a5fa','#fbbf24','#5eead4','#c4b5fd','#f472b6','#a3e635'];
  const colorFor = i => palette[i % palette.length];
  Chart.defaults.color = '#71839d';
  Chart.defaults.font.family = 'Inter';

  if(ruleEntries.length){
    drawClassificationCharts({donut:'chartDonut', legend:'donutLegend', bars:'chartBudget', donutKey:'donut', barsKey:'budget'}, ruleEntries, t1);
    const budgetLabels=[...ruleEntries.map(([name])=>name),t('not_on_budget')];
    const budgetValues=[...ruleEntries.map(([,v])=>num(v.budget)),Math.max(0,t1.budgetNotOnBudget)];
    const budgetColors=[...budgetLabels.slice(0,-1).map((_,i)=>colorFor(i)),'#94a3b8'];
    charts.budgetDonut=new Chart($('chartBudgetDonut'),{
      type:'doughnut',
      data:{labels:budgetLabels,datasets:[{data:budgetValues,backgroundColor:budgetColors,borderColor:ui.light?'#f8fafc':'#0c1626',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'65%'}

  drawIncomeVsChart('chartIncomeVs', 'incomeVs', ruleEntries, t1);
  const records=recordsForMonth(m,m.label);
  bindRecordBrowser(container,'month-overview',records,true);
  bindNotesPanel(container);
  bindMonthMarketValues(container,m);
}

function drawIncomeVsChart(canvasId, chartKey, ruleEntries, t1){
  const palette = ['#60a5fa','#fbbf24','#5eead4','#c4b5fd','#f472b6','#a3e635'];
  const colorFor = i => palette[i % palette.length];

  // The unbudgeted amount is income left after allocating all classification budgets.
  const ivLabels = [t('lbl_income'), t('lbl_goal'), t('lbl_budget'), t('lbl_real'), t('not_on_budget'), t('still_free')];

  const ivDatasets = ruleEntries.map(([name,v],i)=>{
    const goalVal = Math.round((v.target/100)*t1.totalIncomeBudget);
    const budgetVal = Math.round(v.budget);
    return {
      label: name,
      data: [0, goalVal, budgetVal, Math.round(v.real), 0, 0],
      backgroundColor: colorFor(i),
    };
  });
  ivDatasets.unshift({ label:t('lbl_income'), data:[Math.round(t1.totalIncomeBudget), 0, 0, 0, 0, 0], backgroundColor:'#6f89b2' });
  ivDatasets.push({label:t('not_on_budget'),data:[0,0,0,0,Math.round(t1.budgetNotOnBudget),0],backgroundColor:'#94a3b8'});
  ivDatasets.push({label:t('still_free'),data:[0,0,0,0,0,Math.round(t1.stillFree)],backgroundColor:'#64748b'});

  // total empilhado de cada linha, para mostrar "Nome · Total" no eixo em vez de só o nome
  const ivRowTotals = ivLabels.map((_,rowIdx)=> ivDatasets.reduce((s,ds)=>s+(ds.data[rowIdx]||0),0));

  charts[chartKey] = new Chart($(canvasId), {
    type:'bar',
    data:{labels:ivLabels, datasets:ivDatasets},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
      scales:{
        x:{stacked:true, grid:{color:'rgba(80,109,154,.18)'}},
        y:{stacked:true, grid:{display:false}, ticks:{callback:(value,index)=>`${ivLabels[index]} · ${fmtEUR(ivRowTotals[index])}`}}
      },
      plugins:{legend:{display:true, position:'top', align:'end', labels:{boxWidth:10, boxHeight:10}}}}
  });
}

function renderDespesasRegistos(container, m){
  const deltaCell = (budget, actual) => {
    const diff = num(actual) - num(budget);
    if(diff===0) return `<td class="muted" style="text-align:right">—</td>`;
    const cls = diff>0 ? 'dw-delta-pos' : 'dw-delta-neg';
    return `<td class="${cls}" style="text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${diff>0?'+':''}${fmtEUR(diff)}</td>`;
  };

  const natureTable = (nature, headers, rowFn) => {
    const rows = m.items.filter(it=>it.nature===nature).sort((a,b)=>dateTimestamp(b.date)-dateTimestamp(a.date));
    return `<div class="dw-scrolllist"><div class="dw-tablewrap">
      <table class="dw-table compact">
        <thead><tr>${headers.map(h=>`<th${h.right?' style="text-align:right"':''}>${h.label}</th>`).join('')}<th></th></tr></thead>
        <tbody>
          ${rows.length===0 ? `<tr><td colspan="${headers.length+1}" style="text-align:center;padding:14px 0;color:var(--muted)">${t('no_records')}</td></tr>` : rows.map(rowFn).join('')}
        </tbody>
      </table>
    </div></div>`;
  };

  const despesaRow = it => `<tr>
    <td>${displayDate(it.date)}</td><td>${escapeHtml(it.name)}</td>
    <td class="muted">${escapeHtml(it.category||'—')}</td>
    <td class="muted">${escapeHtml(it.classification||'—')}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.budget)}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.actual)}</td>
    ${deltaCell(it.budget, it.actual)}
    <td>${escapeHtml(it.comment||'—')}</td>
    <td style="white-space:nowrap"><button class="dw-icobtn" data-match="${it.id}" title="${t('match_title')}">=</button> <button class="dw-icobtn" data-edit="${it.id}" title="${t('edit')}">✎</button> <button class="dw-icobtn" data-del="${it.id}" title="${t('remove')}">🗑</button></td>
  </tr>`;
  const rendimentoRow = it => `<tr>
    <td>${displayDate(it.date)}</td><td>${escapeHtml(it.name)}</td>
    <td class="muted">${escapeHtml(it.category||'—')}</td><td class="muted">${escapeHtml(it.classification||'—')}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.budget)}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.actual)}</td>
    ${deltaCell(it.budget, it.actual)}
    <td>${escapeHtml(it.comment||'—')}</td>
    <td style="white-space:nowrap"><button class="dw-icobtn" data-match="${it.id}" title="${t('match_title')}">=</button> <button class="dw-icobtn" data-edit="${it.id}" title="${t('edit')}">✎</button> <button class="dw-icobtn" data-del="${it.id}" title="${t('remove')}">🗑</button></td>
  </tr>`;
  const poupDivRow = it => `<tr>
    <td>${displayDate(it.date)}</td><td>${escapeHtml(recordLabel(it)||'—')}</td>
    <td class="muted">${escapeHtml(recordCategory(it)||'—')}</td>
    <td class="muted">${escapeHtml(it.classification||'—')}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.budget)}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${fmtEUR(it.actual)}</td>
    <td>${escapeHtml(it.comment||'—')}</td>
    <td style="white-space:nowrap"><button class="dw-icobtn" data-match="${it.id}" title="${t('match_title')}">=</button> <button class="dw-icobtn" data-edit="${it.id}" title="${t('edit')}">✎</button> <button class="dw-icobtn" data-del="${it.id}" title="${t('remove')}">🗑</button></td>
  </tr>`;

  const accordionSection = (nature, title, headers, rowFn) => {
    const items = m.items.filter(it=>it.nature===nature);
    const count = items.length;
    const sumBudget = items.reduce((s,it)=>s+num(it.budget),0);
    const sumActual = items.reduce((s,it)=>s+num(it.actual),0);

      ${classOpen ? `

  container.innerHTML = `

    ${accordionSection('Despesa', t('nature_despesa'), [{label:t('field_date')},{label:t('col_item')},{label:t('col_category')},{label:t('col_classification')},{label:t('col_budget'),right:true},{label:t('col_real'),right:true},{label:t('col_delta'),right:true},{label:t('field_comment')}], despesaRow)}
    ${accordionSection('Rendimento', t('nature_rendimento'), [{label:t('field_date')},{label:t('col_item')},{label:t('col_category')},{label:t('col_classification')},{label:t('col_budget'),right:true},{label:t('col_real'),right:true},{label:t('col_delta'),right:true},{label:t('field_comment')}], rendimentoRow)}
    ${accordionSection('Poupança', t('nature_poupanca'), [{label:t('field_date')},{label:t('col_savings')},{label:t('col_category')},{label:t('col_classification')},{label:t('col_budget'),right:true},{label:t('col_real'),right:true},{label:t('field_comment')}], poupDivRow)}

        <p class="muted" style="font-size:11px;margin:6px 0 0">${t('bank_balance_hint')}</p>

function drawClassificationCharts(ids, ruleEntries, t1){
  const palette = ['#60a5fa','#fbbf24','#5eead4','#c4b5fd','#f472b6','#a3e635'];
  const colorFor = i => palette[i % palette.length];
  Chart.defaults.color = '#71839d';
  Chart.defaults.font.family = 'Inter';

  const labels = ruleEntries.map(([n])=>n);
  const realVals = ruleEntries.map(([,v])=>v.real);
  const stillFreeValue=t1.stillFree;
  const donutLabels=[...labels,t('still_free')];
  const donutValues=[...realVals,Math.max(0,stillFreeValue)];
  const donutColors=[...labels.map((_,i)=>colorFor(i)),'#64748b'];
  const realTotal = donutValues.reduce((a,b)=>a+b,0) || 1;

  charts[ids.donutKey] = new Chart($(ids.donut), {
    type:'doughnut',
    data:{labels:donutLabels, datasets:[{data:donutValues, backgroundColor:donutColors, borderColor: ui.light?'#f8fafc':'#0c1626', borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, cutout:'65%'}
  });
  $(ids.legend).innerHTML = donutLabels.map((n,i)=>{
    const value=i===donutLabels.length-1?stillFreeValue:realVals[i];
    const percent=donutValues[i]/realTotal*100;
    return `<span><span class="sw" style="background:${donutColors[i]}"></span>${escapeHtml(n)} · ${fmtEUR(value)} (${Math.round(percent)}%)</span>`;
  }).join('');

  const goalVals = ruleEntries.map(([,v])=> (v.target/100) * t1.totalIncomeBudget);
  const budgetVals = ruleEntries.map(([,v])=> v.budget);
  const realColors = ruleEntries.map(([,v],i)=> v.real > v.budget ? '#f87171' : colorFor(i));
  charts[ids.barsKey] = new Chart($(ids.bars), {
    type:'bar',
    data:{labels, datasets:[
      {label:t('lbl_goal'), data:goalVals.map(Math.round), backgroundColor:'#8fb5e8'},
      {label:t('lbl_budget'), data:budgetVals.map(Math.round), backgroundColor:'#6f89b2'},
      {label:t('lbl_real'), data:realVals.map(Math.round), backgroundColor:realColors},
    ]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:true, position:'top', align:'end', labels:{boxWidth:10, boxHeight:10}},
        tooltip:{callbacks:{label:(context)=>{
          let line = `${context.dataset.label}: ${fmtEUR(context.parsed.x)}`;
          if(context.dataset.label === t('lbl_budget')){
            const diff = context.parsed.x - goalVals[context.dataIndex];
            if(Math.round(diff)!==0) line += ` (${diff>0?'+':''}${fmtEUR(diff)} ${t('vs_goal')})`;
          } else if(context.dataset.label === t('lbl_real')){
            const diff = context.parsed.x - budgetVals[context.dataIndex];
            if(Math.round(diff)!==0) line += ` (${diff>0?'+':''}${fmtEUR(diff)} ${t('vs_budget')})`;
          }
          return line;
        }}}},
      scales:{x:{grid:{color:'rgba(80,109,154,.18)'}}, y:{grid:{display:false}}}}
  });
}

function wireInlineCreate(selectId, kindKey){
  const sel = $(selectId);
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    if(sel.value !== '__new__') return;
    const name = window.prompt(t('prompt_new_name',{k:t(kindKey)}));
    if(!name || !name.trim()){ sel.value = ''; return; }
    const clean = name.trim();
    let newValue = clean;

    if(selectId==='fCategory'){
      if(!STATE.categories.includes(clean)) STATE.categories.push(clean);
    } else if(selectId==='fClassification'){
      if(!STATE.classifications.some(c=>c.name===clean)) STATE.classifications.push({name:clean, targetPercent:0, countsPercent:true});
    } else if(selectId==='fRef'){
      const isPoupanca = kindKey==='kind_poupanca';
      let entity;
      if(isPoupanca){
        entity = {id:uid(), name:clean, kind:'Poupança', target:null};
      } else {
        const initialRaw = window.prompt(t('prompt_debt_initial',{n:clean}));
        const initial = parseFloat(initialRaw);
        if(Number.isNaN(initial)){ sel.value=''; return; }
        entity = {id:uid(), name:clean, initial};
      }
      (isPoupanca ? STATE.savings : STATE.debts).push(entity);
      newValue = entity.id;
    }
    saveLocal();

    const opts = [...sel.options].filter(o=>o.value!=='__new__' && o.value!=='');
    const newOpt = document.createElement('option');
    newOpt.value = newValue; newOpt.textContent = clean;
    sel.insertBefore(newOpt, sel.options[opts.length+1]);
    sel.value = newValue;
  });
}

    <label class="dw-field"><span>${t('field_comment')}</span><textarea id="expenseComment" class="dw-cell boxed" rows="2"></textarea></label>
    <div id="expenseError" style="color:var(--red);font-size:12px;margin-bottom:10px;display:none"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px">
      <button class="dw-btn" id="mNewExpense">${t('new_expense')}</button>
      <button class="dw-btn primary" id="mSaveExpense">${t('btn_save')}</button>
    </div>`;
  $('overlay').classList.add('show');
  $('mClose').addEventListener('click',closeModal);
  $('mNewExpense').addEventListener('click',()=>{closeModal();addItem('Despesa');});
  $('mSaveExpense').addEventListener('click',()=>{
    const source=activeMonth()?.items.find(item=>item.id===$('expenseChoice').value);
    const actualRaw=$('expenseActual').value;
    if(!source||actualRaw===''||!Number.isFinite(Number(actualRaw))||Number(actualRaw)<0){
      $('expenseError').textContent=source?t('err_need_amount'):t('err_need_choice');
      $('expenseError').style.display='block';
      return;
    }
    activeMonth().items.push({
      ...source,id:uid(),budget:0,actual:Number(actualRaw),date:normalizeDate($('expenseDate').value),
      comment:$('expenseComment').value.trim(),recurring:false,regularId:null
    });
    saveLocal();closeModal();renderDespesas();renderDashboard();
  });
}

function openDeleteCategoryModal(categoryIndex){
  const category=STATE.categories[categoryIndex];
  if(category==null) return;
  const legacyCategory=account=>account.kind==='Investimento'?'Investments':'Pocket Money';
  const accounts=STATE.savings.filter(account=>
    account.category===category||(!account.category&&STATE.categories.includes(legacyCategory(account))&&legacyCategory(account)===category));
  const recordCount=Object.values(STATE.months).reduce((count,month)=>count+month.items.filter(item=>
    item.nature==='Poupança'?recordCategory(item)===category:item.category===category).length,0);
  const regularCount=STATE.regulars.filter(regular=>regular.category===category).length;
  const linkedCount=recordCount+regularCount+accounts.length;
  const alternatives=STATE.categories.filter(value=>value!==category);
  if(!window.confirm(t('remove_category_confirm',{name:category}))) return;
  if(!linkedCount){
    STATE.categories.splice(categoryIndex,1);
    saveLocal();renderAll();
    return;
  }
  $('modalContent').innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <b style="font-size:14px">${t('remove_category_title')}</b>
      <button id="mClose" class="dw-modal-close">✕</button>
    </div>
    <p class="muted">${t('remove_category_move',{count:linkedCount})}</p>
    ${alternatives.length?`<label class="dw-field"><span>${t('remove_category_target')}</span><select id="categoryReplacement" class="dw-cell boxed">
        ${alternatives.map(value=>`<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('')}
      </select></label>`:`<p style="color:var(--red)">${t('remove_category_no_target')}</p>`}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="dw-btn" id="mCancel">${t('btn_cancel')}</button>
      <button class="dw-btn primary" id="mDeleteCategory" ${!alternatives.length?'disabled':''}>${t('remove')}</button>
    </div>`;
  $('overlay').classList.add('show');
  $('mClose').addEventListener('click',closeModal);
  $('mCancel').addEventListener('click',closeModal);
  $('mDeleteCategory').addEventListener('click',()=>{
    const replacement=$('categoryReplacement')?.value||null;
    Object.values(STATE.months).forEach(month=>month.items.forEach(item=>{
      if(item.category===category) item.category=replacement;
    }));
    STATE.regulars.forEach(regular=>{
      if(regular.category===category) regular.category=replacement;
    });
    accounts.forEach(account=>{account.category=replacement;});
    STATE.categories.splice(categoryIndex,1);
    saveLocal();
    closeModal();
    renderAll();
  });
}

  const {savTotals, debtPaid} = computeEntityTotals();

  $('listSavings').innerHTML = STATE.savings.length ? STATE.savings.map((s,i)=>{
    const total = savTotals[s.id]||0;
    const isInvest = s.kind==='Investimento';
    const market=latestMarketValue(s.id);
    const gain = isInvest && market ? market.value - total : null;
    const gainPct = gain!=null && total>0 ? (gain/total*100) : null;
    return `
    <div class="dw-inlinerow">
      <span class="dw-cell boxed" style="flex:1.2">${escapeHtml(s.name)}</span>
      <select class="dw-cell boxed" style="flex:.8" data-savkind="${i}">
        <option value="Poupança" ${(s.kind||'Poupança')==='Poupança'?'selected':''}>${t('opt_savings')}</option>
        <option value="Investimento" ${s.kind==='Investimento'?'selected':''}>${t('opt_investment')}</option>
      </select>
      <select class="dw-cell boxed" style="flex:1" data-savcategory="${i}" title="${t('saving_account_category')}">
        <option value="">${t('opt_no_category')}</option>
        ${STATE.categories.map(category=>`<option value="${escapeHtml(category)}" ${s.category===category?'selected':''}>${escapeHtml(category)}</option>`).join('')}
      </select>
      <input type="number" class="dw-cell boxed" style="flex:.8" placeholder="${t('opening_balance_ph')}" value="${s.opening||''}" data-savopening="${i}" title="${t('opening_balance_hint')}">
      <span class="dw-cell boxed muted" style="flex:1;text-align:right" title="${t('calculated_title')}">${fmtEUR(total)}</span>
      ${!isInvest?`<input type="number" class="dw-cell boxed" style="flex:1" placeholder="${t('target_ph')}" value="${s.target??''}" data-savtarget="${i}">`:`<span class="dw-cell boxed muted" style="flex:1">${market?fmtEUR(market.value):'—'}</span>`}
      <button class="dw-icobtn" data-delsav="${i}">🗑</button>
    </div>
    ${!isInvest&&s.target ? `<div class="dw-progtrack" style="margin:-2px 0 4px"><div class="dw-progfill" style="width:${Math.min(100, total/s.target*100)}%;background:#5eead4"></div></div>` : ''}
    ${isInvest ? `<div class="dw-inlinerow" style="margin-top:-2px">
      <span class="muted" style="flex:1.2;font-size:11.5px">${t('total_invested')}: ${fmtEUR(total)}</span>
      <span class="muted" style="flex:1.6;font-size:11.5px">${t('market_value')}: ${market?fmtEUR(market.value):'—'}</span>
      ${gain!=null ? `<span style="flex:1;text-align:right;font-size:11.5px;font-weight:800;color:${gain>=0?'var(--green)':'var(--red)'}">${gain>=0?'+':''}${fmtEUR(gain)}${gainPct!=null?' ('+(gain>=0?'+':'')+Math.round(gainPct)+'%)':''}</span>` : `<span style="flex:1"></span>`}
      <span style="width:30px"></span>
    </div>` : ''}
  `;}).join('') : `<p class="muted" style="font-size:12.5px">${t('no_savings')}</p>`;
  $('listSavings').querySelectorAll('[data-savopening]').forEach(inp=>{
    inp.addEventListener('input', e=>{ STATE.savings[parseInt(inp.dataset.savopening)].opening = parseFloat(e.target.value)||0; saveLocal(); });
    inp.addEventListener('change', renderConfigLists);
  });
  $('listSavings').querySelectorAll('[data-savkind]').forEach(sel=>sel.addEventListener('change', e=>{
    const saving=STATE.savings[parseInt(sel.dataset.savkind)];
    saving.kind=e.target.value;
    saveLocal();renderConfigLists();
  }));
  $('listSavings').querySelectorAll('[data-savcategory]').forEach(sel=>sel.addEventListener('change',()=>{
    const saving=STATE.savings[parseInt(sel.dataset.savcategory)];
    saving.category=sel.value||null;
    STATE.regulars.filter(r=>r.refId===saving.id&&r.nature==='Poupança').forEach(r=>r.category=saving.category);
    saveLocal();renderConfigLists();renderDashboard();
  }));
  $('listSavings').querySelectorAll('[data-savtarget]').forEach(inp=>{
    inp.addEventListener('input', e=>{ STATE.savings[parseInt(inp.dataset.savtarget)].target = e.target.value ? parseFloat(e.target.value) : null; saveLocal(); });
    inp.addEventListener('change', renderConfigLists);
  });
  $('listSavings').querySelectorAll('[data-delsav]').forEach(b=>b.addEventListener('click', ()=>{
    STATE.savings.splice(parseInt(b.dataset.delsav),1); saveLocal(); renderConfigLists();
  }));

  $('listDebts').innerHTML = STATE.debts.length ? STATE.debts.map((d,i)=>{
    const paid = debtPaid[d.id]||0;
    const remaining = num(d.initial)-paid;
    return `
    <div class="dw-inlinerow">
      <span class="dw-cell boxed" style="flex:1.4">${escapeHtml(d.name)}</span>
      <input type="number" class="dw-cell boxed" style="flex:1" value="${d.initial}" data-debtinitial="${i}" title="${t('initial_debt_title')}">
      <span class="dw-cell boxed muted" style="flex:1;text-align:right" title="${t('calculated_debt_title')}">${fmtEUR(remaining)}${t('missing_suffix')}</span>
      <button class="dw-icobtn" data-deldebt="${i}">🗑</button>
    </div>
    ${d.initial ? `<div class="dw-progtrack" style="margin:-2px 0 4px"><div class="dw-progfill" style="width:${Math.min(100, paid/d.initial*100)}%;background:#f87171"></div></div>` : ''}
  `;}).join('') : `<p class="muted" style="font-size:12.5px">${t('no_debts')}</p>`;
  $('listDebts').querySelectorAll('[data-debtinitial]').forEach(inp=>{
    inp.addEventListener('input', e=>{ STATE.debts[parseInt(inp.dataset.debtinitial)].initial = parseFloat(e.target.value)||0; saveLocal(); });
    inp.addEventListener('change', renderConfigLists);
  });
  $('listDebts').querySelectorAll('[data-deldebt]').forEach(b=>b.addEventListener('click', ()=>{
    STATE.debts.splice(parseInt(b.dataset.deldebt),1); saveLocal(); renderConfigLists();
  }));
}
