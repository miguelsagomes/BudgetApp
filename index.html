/* ============================================================ ligação a ficheiro (excel) ============================================================ */
function monthSheetName(m){ return (m.label+'').replace(/[\\\/?*[\]:]/g,' ').trim().slice(0,28) || 'Mes'; }

function buildWorkbook(){
  const wb = XLSX.utils.book_new();
  const {savTotals, debtPaid} = computeEntityTotals();

  const addSheet = (aoa, name, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if(widths) ws['!cols'] = widths.map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, name);
    return ws;
  };

  addSheet([['Nome'], ...STATE.categories.map(c=>[c])], 'Categorias', [22]);
  addSheet([['Nome','Meta%','ContaRegra'], ...STATE.classifications.map(c=>[c.name,c.targetPercent,c.countsPercent?'Sim':'Não'])], 'Classificacoes', [22,10,12]);
  const regularRows=[['ID','Item','Tipo','Categoria','Classificacao','Orcamento','Conta']];
  STATE.regulars.forEach(r=>{
    const refName=r.nature==='Poupança'?STATE.savings.find(x=>x.id===r.refId)?.name:r.nature==='Dívida'?STATE.debts.find(x=>x.id===r.refId)?.name:'';
    regularRows.push([r.id,r.name,r.nature,r.category||'',r.classification||'',num(r.budget),refName||'']);
  });
  addSheet(regularRows,'Regulares',[14,24,16,20,20,14,24]);
  addSheet([
    ['Nome','Tipo','Saldo Inicial','Meta','Total Investido (calculado)','Valor Atual (mercado)','MostrarValorMercado','Categoria'],
    ...STATE.savings.map(s=>{
      const market=latestMarketValue(s.id);
      return [s.name,s.kind||'Poupança',s.opening||0,s.kind==='Investimento'?'':(s.target||''),savTotals[s.id]||0,s.kind==='Investimento'?(market?.value??''):'',s.showMarketValue?'Sim':'Não',s.category||''];
    })
  ], 'Poupancas', [26,14,14,12,22,20,20,22]);
  addSheet([
    ['Nome','Valor Inicial','Pago (calculado)','Em Falta (calculado)'],
    ...STATE.debts.map(d=>[d.name, d.initial||0, debtPaid[d.id]||0, num(d.initial)-(debtPaid[d.id]||0)])
  ], 'Dividas', [26,14,16,16]);
  const noteRows=[['Ambito','Mes','Data','Comentario']];
  STATE.notes.forEach(n=>noteRows.push([n.scope==='month'?'Mês':'Dashboard',n.scope==='month'?STATE.months[n.monthId]?.label||'':'',displayDate(n.date),n.text]));
  addSheet(noteRows,'Notas',[16,24,16,60]);

  const refLabel = it => it.nature==='Poupança' ? (STATE.savings.find(s=>s.id===it.refId)?.name||'')
    : it.nature==='Dívida' ? (STATE.debts.find(d=>d.id===it.refId)?.name||'') : '';

  const used = new Set();
  STATE.order.forEach(id=>{
    const m = STATE.months[id];
    const aoa = [];
    aoa.push(['Mês', m.label]); aoa.push(['Ano', m.year]);
    aoa.push(['Saldo Banco Atual', m.bankBalanceNow]);
    aoa.push([]); aoa.push(['BASE - CLASSIFICACOES']);
    aoa.push(['Nome','Meta%','ContaRegra']);
    m.classificationsSnapshot.forEach(c=>aoa.push([c.name,c.targetPercent,c.countsPercent?'Sim':'Não']));
    aoa.push([]); aoa.push(['DESPESAS']);
    aoa.push(['Nome','Orçamento','Real','Categoria','Classificacao','Regular','Data','Comentario','RegularID']);
    m.items.filter(it=>it.nature==='Despesa').forEach(it=>aoa.push([it.name||'', it.budget, it.actual, it.category||'', it.classification||'', it.regularId?'Sim':'Não',displayDate(it.date),it.comment||'',it.regularId||'']));

    aoa.push([]); aoa.push(['RENDIMENTO']);
    aoa.push(['Nome','Orçamento','Real','Regular','Categoria','Classificacao','Data','Comentario','RegularID']);
    m.items.filter(it=>it.nature==='Rendimento').forEach(it=>aoa.push([it.name||'', it.budget, it.actual, it.regularId?'Sim':'Não',it.category||'',it.classification||'',displayDate(it.date),it.comment||'',it.regularId||'']));

    aoa.push([]); aoa.push(['POUPANCA']);
    aoa.push(['Conta','Orçamento','Real','Classificacao','Data','Comentario','RegularID']);
    m.items.filter(it=>it.nature==='Poupança').forEach(it=>aoa.push([refLabel(it), it.budget, it.actual, it.classification||'',displayDate(it.date),it.comment||'',it.regularId||'']));

    aoa.push([]); aoa.push(['DIVIDA']);
    aoa.push(['Conta','Orçamento','Real','Classificacao','Data','Comentario','RegularID']);
    m.items.filter(it=>it.nature==='Dívida').forEach(it=>aoa.push([refLabel(it), it.budget, it.actual, it.classification||'',displayDate(it.date),it.comment||'',it.regularId||'']));

    aoa.push([]); aoa.push(['VALOR MERCADO INVESTIMENTOS']);
    aoa.push(['Conta','Valor Mercado']);
    Object.entries(m.marketValues||{}).forEach(([id,value])=>{
      const account=STATE.savings.find(s=>s.id===id);
      if(account&&account.kind==='Investimento'&&value!=null) aoa.push([account.name,value]);
    });

    let name = monthSheetName(m), n=2;
    while(used.has(name)) name = monthSheetName(m)+'('+(n++)+')';
    used.add(name);
    addSheet(aoa, name, [16,24,12,12,16,16,10]);
  });
  return wb;
}

function reportMonthNumber(m){
  const monthName=String(m.label||'').replace(/\d{4}/g,'').trim().toLocaleLowerCase();
  let index=MESES_EN.findIndex(name=>name.toLocaleLowerCase()===monthName);
  if(index<0) index=MESES_PT.findIndex(name=>name.toLocaleLowerCase()===monthName);
  if(index<0){
    const firstItem=m.items?.find(item=>item.date);
    if(firstItem) index=new Date(`${normalizeDate(firstItem.date)}T00:00:00`).getMonth();
  }
  return index>=0?index+1:1;
}

function reportItems(months,nature){
  return months.flatMap(m=>m.items.filter(item=>item.nature===nature).map(item=>({month:m,item})));
}

function reportSavingKind(item){
  return STATE.savings.find(account=>account.id===item.refId)?.kind||'Poupança';
}

function reportContribution(months,kind){
  return reportItems(months,'Poupança').reduce((sum,{item})=>
    sum+(reportSavingKind(item)===kind?num(item.actual):0),0);
}

function reportAccountTotal(account,throughIndex){
  return num(account.opening)+STATE.order.slice(0,throughIndex+1).reduce((sum,id)=>{
    const month=STATE.months[id];
    return sum+(month?.items||[]).filter(item=>item.nature==='Poupança'&&item.refId===account.id)
      .reduce((monthSum,item)=>monthSum+num(item.actual),0);
  },0);
}

function reportMarketValue(accountId,throughIndex){
  for(let i=throughIndex;i>=0;i--){
    const month=STATE.months[STATE.order[i]];
    const value=month?.marketValues?.[accountId];
    if(value!=null&&value!=='') return num(value);
  }
  return null;
}

function setReportAutoFilter(ws,headerRow,dataCount,columnCount){
  if(dataCount<1) return;
  ws['!autofilter']={ref:XLSX.utils.encode_range({
    s:{r:headerRow,c:0},
    e:{r:headerRow+dataCount,c:columnCount-1},
  })};
}

function formatReportNumbers(ws,startRow,endRow,currencyColumns=[],percentageColumns=[]){
  for(let row=startRow;row<=endRow;row++){
    currencyColumns.forEach(column=>{
      const cell=ws[XLSX.utils.encode_cell({r:row,c:column})];
      if(cell&&typeof cell.v==='number') cell.z='€ #,##0.00';
    });
    percentageColumns.forEach(column=>{
      const cell=ws[XLSX.utils.encode_cell({r:row,c:column})];
      if(cell&&typeof cell.v==='number') cell.z='0.0%';
    });
  }
}

function buildReportWorkbook(monthIds,reportMode='month'){
  const wb=XLSX.utils.book_new();
  const months=monthIds.map(id=>STATE.months[id]).filter(Boolean);
  if(!months.length) return wb;
  const isAnnual=reportMode==='year';
  const firstIndex=STATE.order.indexOf(monthIds[0]);
  const lastIndex=STATE.order.indexOf(monthIds[monthIds.length-1]);
  const periodEnd=months[months.length-1];
  const addSheet=(rows,name,widths)=>{
    const ws=XLSX.utils.aoa_to_sheet(rows);
    if(widths) ws['!cols']=widths.map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,name);
    return ws;
  };
  const notes=[['Scope','Month','Date','Note']];
  months.forEach(m=>{
    STATE.notes.filter(n=>n.scope==='month'&&n.monthId===STATE.order.find(id=>STATE.months[id]===m))
      .forEach(n=>notes.push(['Month',m.label,displayDate(n.date),n.text]));
  });
  STATE.notes.filter(n=>n.scope==='dashboard').forEach(n=>notes.push(['Dashboard','',displayDate(n.date),n.text]));

  if(isAnnual){
    const accountPeriodTotals=STATE.savings.map(account=>{
      const starting=reportAccountTotal(account,firstIndex-1);
      const ending=reportAccountTotal(account,lastIndex);
      const added=reportItems(months,'Poupança').reduce((sum,{item})=>
        sum+(item.refId===account.id?num(item.actual):0),0);
      const market=account.kind==='Investimento'?reportMarketValue(account.id,lastIndex):null;
      return {account,starting,added,ending,market};
    });
    const totals=accountPeriodTotals.reduce((result,row)=>{
      if(row.account.kind==='Investimento'){
        result.investedStart+=row.starting;
        result.investedAdded+=row.added;
        result.investedEnd+=row.ending;
        result.marketEnd+=row.market??row.ending;
      }else{
        result.savedStart+=row.starting;
        result.savedAdded+=row.added;
        result.savedEnd+=row.ending;
      }
      return result;
    },{savedStart:0,savedAdded:0,savedEnd:0,investedStart:0,investedAdded:0,investedEnd:0,marketEnd:0});
    const rows=[
      ['Savings and investments',periodEnd.label],
      ['Type','Starting Point','Added during year','Ending balance','Added vs Starting Point'],
      ['Saved',totals.savedStart,totals.savedAdded,totals.savedEnd,totals.savedStart?totals.savedAdded/totals.savedStart:''],
      ['Invested',totals.investedStart,totals.investedAdded,totals.investedEnd,totals.investedStart?totals.investedAdded/totals.investedStart:''],
      ['Net Worth (invested basis)',totals.savedStart+totals.investedStart,totals.savedAdded+totals.investedAdded,
        totals.savedEnd+totals.investedEnd,(totals.savedStart+totals.investedStart)?(totals.savedAdded+totals.investedAdded)/(totals.savedStart+totals.investedStart):''],
      ['Net Worth (market value)',totals.savedStart+totals.investedStart,totals.savedAdded+totals.investedAdded,
        totals.savedEnd+totals.marketEnd,(totals.savedStart+totals.investedStart)?(totals.savedEnd+totals.marketEnd)/(totals.savedStart+totals.investedStart)-1:''],
      [],
      [],
      ['Month','Income','Expenses','Saved','Invested'],
    ];
    months.forEach(m=>{
      const totalsForMonth=computeMonthTotals(m);
      rows.push([m.label,totalsForMonth.totalIncomeActual,totalsForMonth.totalDespesasActual,
        reportContribution([m],'Poupança'),reportContribution([m],'Investimento')]);
    });
    rows.push(['Total',months.reduce((sum,m)=>sum+computeMonthTotals(m).totalIncomeActual,0),
      months.reduce((sum,m)=>sum+computeMonthTotals(m).totalDespesasActual,0),
      reportContribution(months,'Poupança'),reportContribution(months,'Investimento')]);
    const ws=addSheet(rows,'Summary',[22,18,18,20,20]);
    setReportAutoFilter(ws,8,months.length,5);
    formatReportNumbers(ws,2,5,[1,2,3],[4]);
    formatReportNumbers(ws,9,9+months.length,[1,2,3,4]);
  }else{
    const m=periodEnd;
    const totals=computeMonthTotals(m);
    const savedBudget=m.items.filter(item=>item.nature==='Poupança'&&reportSavingKind(item)!=='Investimento')
      .reduce((sum,item)=>sum+num(item.budget),0);
    const investedBudget=m.items.filter(item=>item.nature==='Poupança'&&reportSavingKind(item)==='Investimento')
      .reduce((sum,item)=>sum+num(item.budget),0);
    const classes=Object.entries(totals.byClass).filter(([,value])=>value.counts);
    const rows=[
      ['Month','Income Budget','Income Real','Expenses Budget','Expenses Real','Savings Budget','Savings Real','Investments Budget','Investments Real'],
      [m.label,totals.totalIncomeBudget,totals.totalIncomeActual,totals.totalDespesasBudget,totals.totalDespesasActual,
        savedBudget,reportContribution([m],'Poupança'),investedBudget,reportContribution([m],'Investimento')],
      [],
      ['Classification comparison'],
      ['Classification','Goal %','Goal €','Budget %','Budget €','Budget - Goal €','Budget - Goal (pp)','Real %','Real €','Real - Budget €','Real - Budget (pp)'],
    ];
    const classificationHeaderRow=4;
    classes.forEach(([name,value])=>{
      const goalPct=num(value.target)/100;
      const budgetPct=totals.totalIncomeBudget?num(value.budget)/totals.totalIncomeBudget:0;
      const realPct=totals.totalIncomeBudget?num(value.real)/totals.totalIncomeBudget:0;
      const goalValue=goalPct*totals.totalIncomeBudget;
      rows.push([name,goalPct,goalValue,budgetPct,num(value.budget),num(value.budget)-goalValue,
        (budgetPct-goalPct)*100,realPct,num(value.real),num(value.real)-num(value.budget),(realPct-budgetPct)*100]);
    });
    if(classes.length){
      rows.push(['Total','',classes.reduce((sum,[,value])=>sum+num(value.target)/100*totals.totalIncomeBudget,0),'',
        classes.reduce((sum,[,value])=>sum+num(value.budget),0),
        classes.reduce((sum,[,value])=>sum+num(value.budget)-num(value.target)/100*totals.totalIncomeBudget,0),'','',
        classes.reduce((sum,[,value])=>sum+num(value.real),0),
        classes.reduce((sum,[,value])=>sum+num(value.real)-num(value.budget),0),'']);
    }
    const ws=addSheet(rows,'Summary',[22,13,15,13,15,18,17,13,15,18,18]);
    setReportAutoFilter(ws,classificationHeaderRow,classes.length,11);
    formatReportNumbers(ws,1,1,[1,2,3,4,5,7,8,9]);
    formatReportNumbers(ws,classificationHeaderRow+1,classificationHeaderRow+classes.length+1,[2,4,5,8,9]);
    formatReportNumbers(ws,classificationHeaderRow+1,classificationHeaderRow+classes.length,[],[1,3,7]);
    classes.forEach((_,i)=>{
      [6,10].forEach(column=>{
        const cell=ws[XLSX.utils.encode_cell({r:classificationHeaderRow+1+i,c:column})];
        if(cell) cell.z='0.0';
      });
    });
  }

  const detailRows=(nature)=>reportItems(months,nature).map(({month,item})=>
    [...(isAnnual?[month.label]:[]),displayDate(item.date),recordLabel(item),recordCategory(item),item.classification||'',num(item.budget),num(item.actual),item.comment||'']);
  const recordHeader=(annual)=>[...(annual?['Month']:[]),'Date','Item','Category','Classification','Budget','Real','Comment'];
  const addRecordSheet=(nature,name)=>{
    const rows=[recordHeader(isAnnual),...detailRows(nature)];
    const budgetColumn=isAnnual?5:4;
    const realColumn=budgetColumn+1;
    const total=Array(isAnnual?8:7).fill('');
    total[isAnnual?2:1]='Total';
    total[budgetColumn]=reportItems(months,nature).reduce((sum,{item})=>sum+num(item.budget),0);
    total[realColumn]=reportItems(months,nature).reduce((sum,{item})=>sum+num(item.actual),0);
    rows.push(total);
    const ws=addSheet(rows,name,isAnnual?[18,15,28,20,20,14,14,50]:[15,28,20,20,14,14,50]);
    setReportAutoFilter(ws,0,rows.length-2,rows[0].length);
    formatReportNumbers(ws,1,rows.length-1,[budgetColumn,realColumn]);
  };
  addRecordSheet('Despesa','Expenses');
  addRecordSheet('Rendimento','Income');

  const accountSummaryRows=(kind)=>{
    const accounts=STATE.savings.filter(account=>(account.kind||'Poupança')===kind);
    return accounts.map(account=>{
      const periodContribution=reportItems(months,'Poupança').reduce((sum,{item})=>
        sum+(item.refId===account.id?num(item.actual):0),0);
      return {account,periodContribution,total:reportAccountTotal(account,lastIndex),
        starting:reportAccountTotal(account,firstIndex-1)};
    });
  };
  const accountRecordRows=(kind)=>reportItems(months,'Poupança')
    .filter(({item})=>reportSavingKind(item)===kind)
    .map(({month,item})=>[...(isAnnual?[month.label]:[]),displayDate(item.date),recordLabel(item),num(item.actual),item.comment||'']);
  const addAccountSheets=(kind,name,recordsName)=>{
    const investment=kind==='Investimento';
    const accounts=accountSummaryRows(kind);
    const summaryHeaders=investment
      ?['Investment',...(isAnnual?['Starting Point','Invested during year']:['Invested this month']),'Total Invested','Market Value','Market vs Invested %',...(isAnnual?['Added vs Starting Point %']:[])]
      :['Saving',...(isAnnual?['Starting Point','Saved during year']:['Saved this month']),'Total Saved','Goal','Goal %',...(isAnnual?['Added vs Starting Point %']:[])];
    const summaryRows=[summaryHeaders];
    accounts.forEach(row=>{
      const {account,periodContribution,total,starting}=row;
      if(investment){
        const marketValue=reportMarketValue(account.id,lastIndex);
        summaryRows.push(isAnnual
          ?[account.name,row.starting,periodContribution,total,marketValue??'',total>0&&marketValue!=null?marketValue/total-1:'',row.starting?periodContribution/row.starting:'']
          :[account.name,periodContribution,total,marketValue??'',total>0&&marketValue!=null?marketValue/total-1:'']);
      }else{
        summaryRows.push(isAnnual
          ?[account.name,row.starting,periodContribution,total,account.target??'',account.target?total/account.target:'',row.starting?periodContribution/row.starting:'']
          :[account.name,periodContribution,total,account.target??'',account.target?total/account.target:'']);
      }
    });
    const totalContribution=accounts.reduce((sum,row)=>sum+row.periodContribution,0);
    const totalBalance=accounts.reduce((sum,row)=>sum+row.total,0);
    const totalGoal=investment?null:accounts.reduce((sum,row)=>sum+num(row.account.target),0);
    const totalMarket=investment?accounts.reduce((sum,row)=>sum+(reportMarketValue(row.account.id,lastIndex)??row.total),0):null;
    const totalStarting=accounts.reduce((sum,row)=>sum+row.starting,0);
    summaryRows.push(investment
      ?(isAnnual
        ?['Total',totalStarting,totalContribution,totalBalance,totalMarket??'',totalBalance>0&&totalMarket!=null?totalMarket/totalBalance-1:'',totalStarting?totalContribution/totalStarting:'']
        :['Total',totalContribution,totalBalance,totalMarket??'',totalBalance>0&&totalMarket!=null?totalMarket/totalBalance-1:''])
      :(isAnnual
        ?['Total',totalStarting,totalContribution,totalBalance,totalGoal??'',totalGoal?totalBalance/totalGoal:'',totalStarting?totalContribution/totalStarting:'']
        :['Total',totalContribution,totalBalance,totalGoal??'',totalGoal?totalBalance/totalGoal:'']));
    const summaryWs=addSheet(summaryRows,name,isAnnual?[24,18,20,20,18,22,24]:[24,20,20,18,20]);
    setReportAutoFilter(summaryWs,0,accounts.length,summaryHeaders.length);
    formatReportNumbers(summaryWs,1,accounts.length+1,isAnnual?[1,2,3,4]:[1,2,3],
      isAnnual?[5,6]:[4]);
    const recordHeader=[...(isAnnual?['Month']:[]),'Date',investment?'Investment':'Saving','Real','Comment'];
    const records=[recordHeader,...accountRecordRows(kind)];
    const recordTotal=Array(recordHeader.length).fill('');
    recordTotal[isAnnual?2:1]='Total';
    recordTotal[isAnnual?3:2]=totalContribution;
    records.push(recordTotal);
    const recordsWs=addSheet(records,recordsName,isAnnual?[18,15,28,14,50]:[15,28,14,50]);
    setReportAutoFilter(recordsWs,0,records.length-2,recordHeader.length);
    formatReportNumbers(recordsWs,1,records.length-1,[isAnnual?3:2]);
  };
  addAccountSheets('Poupança','Savings','Savings Records');
  addAccountSheets('Investimento','Investments','Investment Records');

  const notesWs=addSheet(notes,'Notes',[14,20,16,60]);
  setReportAutoFilter(notesWs,0,notes.length-1,notes[0].length);
  return wb;
}

function reportChartImage(classes){
  if(!classes.length) return null;
  if(typeof Chart==='undefined') throw new Error('Chart.js is not available.');
  const canvas=document.createElement('canvas');
  canvas.width=1400;
  canvas.height=Math.max(420,classes.length*90+180);
  const palette=['#60a5fa','#fbbf24','#5eead4','#c4b5fd','#f472b6','#a3e635'];
  const chart=new Chart(canvas,{
    type:'bar',
    data:{
      labels:classes.map(row=>row.name),
      datasets:[
        {label:'Goal',data:classes.map(row=>row.goal),backgroundColor:'#94a3b8'},
        {label:'Budget',data:classes.map(row=>row.budget),backgroundColor:'#fbbf24'},
        {label:'Real',data:classes.map(row=>row.real),backgroundColor:palette[0]},
      ],
    },
    options:{
      animation:false,indexAxis:'y',responsive:false,
      scales:{x:{beginAtZero:true,title:{display:true,text:'€'}},y:{grid:{display:false}}},
      plugins:{title:{display:true,text:'Goal, Budget and Real by Classification'},legend:{position:'top'}},
    },
  });
  const image={data:chart.toBase64Image('image/png',1),width:canvas.width,height:canvas.height};
  chart.destroy();
  return image;
}

async function addReportChartToWorkbook(workbookBytes,chartImage,anchorRow){
  if(typeof JSZip==='undefined') throw new Error('JSZip is not available.');
  const zip=await JSZip.loadAsync(workbookBytes);
  const chartWidth=12192000;
  const chartHeight=Math.round(chartWidth*chartImage.height/chartImage.width);
  const sheetPath='xl/worksheets/sheet1.xml';
  const sheet=await zip.file(sheetPath).async('string');
  const relsPath='xl/worksheets/_rels/sheet1.xml.rels';
  const rels=zip.file(relsPath)
    ?await zip.file(relsPath).async('string')
    :'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  const drawing=`<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${anchorRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:ext cx="${chartWidth}" cy="${chartHeight}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="1" name="Classification Goal Budget Real"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${chartWidth}" cy="${chartHeight}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>`;
  const drawingRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.png"/></Relationships>';
  const sheetRel='<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>';
  const types=await zip.file('[Content_Types].xml').async('string');
  const pngDefault=types.includes('Extension="png"')?'':'<Default Extension="png" ContentType="image/png"/>';
  const updatedTypes=types
    .replace('</Types>',`${pngDefault}<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
  let updatedSheet=sheet;
  if(!updatedSheet.includes('xmlns:r=')) updatedSheet=updatedSheet.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
  updatedSheet=updatedSheet.replace('</worksheet>','<drawing r:id="rId1"/></worksheet>');
  zip.file(sheetPath,updatedSheet);
  zip.file(relsPath,rels.replace('</Relationships>',sheetRel+'</Relationships>'));
  zip.file('xl/drawings/drawing1.xml',drawing);
  zip.file('xl/drawings/_rels/drawing1.xml.rels',drawingRels);
  zip.file('[Content_Types].xml',updatedTypes);
  zip.file('xl/media/image1.png',chartImage.data.split(',')[1],{base64:true});
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function downloadReportBlob(blob,filename){
  const link=document.createElement('a');
  const url=URL.createObjectURL(blob);
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function downloadReport(monthIds,reportMode='month'){
  if(!monthIds.length){showToast(t('report_no_months'));return;}
  const months=monthIds.map(id=>STATE.months[id]).filter(Boolean);
  if(!months.length){showToast(t('report_no_months'));return;}
  try{
    const ids=months.map(m=>STATE.order.find(id=>STATE.months[id]===m));
    const wb=buildReportWorkbook(ids,reportMode);
    if(reportMode==='month'&&months.length===1){
      const m=months[0];
      const mTotals=computeMonthTotals(m);
      const classes=Object.entries(mTotals.byClass).filter(([,value])=>value.counts).map(([name,value])=>({
        name,goal:num(value.target)/100*mTotals.totalIncomeBudget,budget:num(value.budget),real:num(value.real),
      }));
      if(classes.length){
        const image=reportChartImage(classes);
        const workbookBytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});
        const blob=await addReportChartToWorkbook(workbookBytes,image,7+classes.length);
        const prefix=`${m.year}${String(reportMonthNumber(m)).padStart(2,'0')}`;
        downloadReportBlob(blob,`${prefix}-Budget-report-${monthSheetName(m)}.xlsx`);
        showToast(t('report_downloaded'));
        return;
      }
    }
    const prefix=reportMode==='year'?String(months[0].year):`${months[0].year}${String(reportMonthNumber(months[0])).padStart(2,'0')}`;
    const filename=reportMode==='year'
      ?`${prefix}-Budget-report.xlsx`
      :`${prefix}-Budget-report-${monthSheetName(months[0])}.xlsx`;
    XLSX.writeFile(wb,filename);
    showToast(t('report_downloaded'));
  }catch(error){
    console.error('Could not export the budget report.',error);
    showToast(t('report_failed'));
  }
}

function buildNewYearWorkbook(year,monthIndex){
  const original=STATE;
  const copy=JSON.parse(JSON.stringify(original));
  STATE={
    ...emptyState(),
    categories:copy.categories,
    classifications:copy.classifications,
    regulars:copy.regulars,
    savings:copy.savings,
    debts:copy.debts,
    notes:[],
  };
  try{
    const monthNames=ui.lang==='en'?MESES_EN:MESES_PT;
    const label=`${monthNames[monthIndex]} ${year}`;
    const month=newMonthFrom(null,label,year);
    const id=uid();
    STATE.months[id]=month;
    STATE.order=[id];
    STATE.active=id;
    return buildWorkbook();
  } finally {
    STATE=original;
  }
}

function sheetToAoa(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, defval:null}); }

// lê uma secção "uncapped": a partir da linha de cabeçalho (2 linhas depois do título),
// vai lendo linhas até encontrar uma em branco na 1ª coluna — sem limite de registos.
function readSection(aoa, startIdx, colCount){
  const rows = [];
  let i = startIdx + 2; // salta o título + o cabeçalho
  while(i<aoa.length && aoa[i] && aoa[i][0]!=null && aoa[i][0]!==''){
    rows.push(aoa[i].slice(0, colCount));
    i++;
  }
  return {rows, nextIdx:i};
}

function loadWorkbook(wb){
  const next = emptyState();
  if(wb.Sheets['Categorias']) sheetToAoa(wb.Sheets['Categorias']).slice(1).forEach(r=>{ if(r[0]) next.categories.push(String(r[0])); });
  if(wb.Sheets['Classificacoes']) sheetToAoa(wb.Sheets['Classificacoes']).slice(1).forEach(r=>{ if(r[0]) next.classifications.push({name:String(r[0]), targetPercent:num(r[1]), countsPercent:String(r[2]||'').toLowerCase()==='sim'}); });
  // Poupancas/Dividas: só se lê a DEFINIÇÃO (nome, tipo, meta / valor inicial) — as
  // colunas "calculado" são só para leitura humana no Excel, nunca lidas de volta.
  if(wb.Sheets['Poupancas']) sheetToAoa(wb.Sheets['Poupancas']).slice(1).forEach(r=>{
    if(r[0]) next.savings.push({id:uid(), name:String(r[0]), kind:(r[1]==='Investimento'?'Investimento':'Poupança'), opening:num(r[2]), target: r[3]?num(r[3]):null, currentValue: r[5]!=null && r[5]!=='' ? num(r[5]) : null,showMarketValue:String(r[6]||'').toLowerCase()==='sim',category:r[7]?String(r[7]):null});
  });
  if(wb.Sheets['Dividas']) sheetToAoa(wb.Sheets['Dividas']).slice(1).forEach(r=>{
    if(r[0]) next.debts.push({id:uid(), name:String(r[0]), initial: num(r[1])});
  });

  if(wb.Sheets['Regulares']) sheetToAoa(wb.Sheets['Regulares']).slice(1).forEach(r=>{
    if(!r[1]||!NATURES.includes(String(r[2]))) return;
    const refName=r[6]?String(r[6]):'';
    const refList=r[2]==='Poupança'?next.savings:r[2]==='Dívida'?next.debts:[];
    next.regulars.push({
      id:r[0]?String(r[0]):uid(),name:String(r[1]),nature:String(r[2]),category:r[3]?String(r[3]):null,
      classification:r[4]?String(r[4]):null,budget:num(r[5]),refId:refList.find(x=>x.name===refName)?.id||null,refName
    });
  });

  const reserved = ['Categorias','Classificacoes','Globais','Poupancas','Dividas','Regulares','Notas'];
  wb.SheetNames.filter(n=>!reserved.includes(n)).forEach(sheetName=>{
    const aoa = sheetToAoa(wb.Sheets[sheetName]);
    const m = {label: sheetName, year: new Date().getFullYear(), bankBalanceNow:0, items:[], classificationsSnapshot:[],marketValues:{}};
    for(let i=0;i<aoa.length;i++){
      const row = aoa[i]; if(!row) continue;
      if(row[0]==='Mês') m.label = row[1]||sheetName;
      else if(row[0]==='Ano') m.year = num(row[1]);
      else if(row[0]==='Saldo Banco Atual') m.bankBalanceNow = num(row[1]);
      else if(row[0]==='BASE - CLASSIFICACOES'){
        i+=2;
        while(i<aoa.length && aoa[i] && aoa[i][0]){ m.classificationsSnapshot.push({name:aoa[i][0], targetPercent:num(aoa[i][1]), countsPercent:String(aoa[i][2]||'').toLowerCase()==='sim'}); i++; }
      } else if(row[0]==='DESPESAS'){
        const hasOverviewColumn=aoa[i+1]?.includes('MostrarOverview');
        const {rows, nextIdx} = readSection(aoa, i, 10);
        rows.forEach(r=>m.items.push({id:uid(), name:r[0], budget:num(r[1]), actual:num(r[2]), nature:'Despesa', category:r[3]||null, classification:r[4]||null, recurring:String(r[5]||'').toLowerCase()==='sim',
          date:r[6]?normalizeDate(r[6]):monthStart(m),comment:String(r[7]||''),regularId:r[hasOverviewColumn?9:8]?String(r[hasOverviewColumn?9:8]):null}));
        i = nextIdx - 1;
      } else if(row[0]==='RENDIMENTO'){
        const hasOverviewColumn=aoa[i+1]?.includes('MostrarOverview');
        const {rows, nextIdx} = readSection(aoa, i, 10);
        rows.forEach(r=>m.items.push({id:uid(), name:r[0], budget:num(r[1]), actual:num(r[2]), nature:'Rendimento', recurring:String(r[3]||'').toLowerCase()==='sim',category:r[4]||null,classification:r[5]||null,
          date:r[6]?normalizeDate(r[6]):monthStart(m),comment:String(r[7]||''),regularId:r[hasOverviewColumn?9:8]?String(r[hasOverviewColumn?9:8]):null}));
        i = nextIdx - 1;
      } else if(row[0]==='POUPANCA'){
        const hasOverviewColumn=aoa[i+1]?.includes('MostrarOverview');
        const {rows, nextIdx} = readSection(aoa, i, 8);
        rows.forEach(r=>m.items.push({id:uid(), name:'', budget:num(r[1]), actual:num(r[2]), nature:'Poupança', classification:r[3]||null, refId:null, refName:r[0]||null,
          date:r[4]?normalizeDate(r[4]):monthStart(m),comment:String(r[5]||''),regularId:r[hasOverviewColumn?7:6]?String(r[hasOverviewColumn?7:6]):null}));
        i = nextIdx - 1;
      } else if(row[0]==='DIVIDA'){
        const hasOverviewColumn=aoa[i+1]?.includes('MostrarOverview');
        const {rows, nextIdx} = readSection(aoa, i, 8);
        rows.forEach(r=>m.items.push({id:uid(), name:'', budget:num(r[1]), actual:num(r[2]), nature:'Dívida', classification:r[3]||null, refId:null, refName:r[0]||null,
          date:r[4]?normalizeDate(r[4]):monthStart(m),comment:String(r[5]||''),regularId:r[hasOverviewColumn?7:6]?String(r[hasOverviewColumn?7:6]):null}));
        i = nextIdx - 1;
      } else if(row[0]==='VALOR MERCADO INVESTIMENTOS'){
        const {rows,nextIdx}=readSection(aoa,i,2);
        rows.forEach(r=>{if(r[0]) m.marketValues[String(r[0])]=num(r[1]);});
        i = nextIdx - 1;
      }
    }
    const id = uid(); next.months[id] = m; next.order.push(id);
  });
  next.active = next.order[0] || null;

  // liga cada registo de Poupança/Dívida à conta certa pelo NOME (os ids são
  // recriados a cada carregamento, por isso não se pode confiar neles entre gravações)
  Object.values(next.months).forEach(m=>{
    m.items.forEach(it=>{
      if(it.refName){
        const list = it.nature==='Poupança' ? next.savings : it.nature==='Dívida' ? next.debts : null;
        const match = list && list.find(x=>x.name===it.refName);
        if(match) it.refId = match.id;
        delete it.refName;
      }
      if(it.nature==='Poupança'){
        const account=next.savings.find(x=>x.id===it.refId);
        it.category=account?.kind==='Investimento'?'Investments':'Pocket Money';
      }
    });
    const marketValues={};
    Object.entries(m.marketValues||{}).forEach(([name,value])=>{
      const account=next.savings.find(x=>x.name===name&&x.kind==='Investimento');
      if(account) marketValues[account.id]=value;
    });
    m.marketValues=marketValues;
  });

  if(wb.Sheets['Notas']){
    sheetToAoa(wb.Sheets['Notas']).slice(1).forEach(r=>{
      if(!r[3]) return;
      const scope=String(r[0]||'').toLowerCase()==='mês'||String(r[0]||'').toLowerCase()==='month'?'month':'dashboard';
      const monthId=scope==='month'?next.order.find(id=>next.months[id].label===String(r[1]||''))||null:null;
      if(scope==='month'&&!monthId) return;
      next.notes.push({id:uid(),scope,monthId,date:r[2]?normalizeDate(r[2]):todayISO(),text:String(r[3])});
    });
  }
  STATE = normalizeState(next); saveLocal();
}

async function connectFile(){
  if(!supportsFS){
    $('fileInputFallback').click();
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({types:[{description:'Excel', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});
    ui.fileHandle = handle; ui.fileName = handle.name; ui.pendingHandle = null;
    await idbSet('lastHandle', handle);
    await readFromHandle(handle);
    updateFileInfo();
  }catch(e){ /* utilizador cancelou */ }
}

// Devolve true se o ficheiro foi carregado, false se o utilizador preferiu manter as alterações locais.
async function readFromHandle(handle){
  const hadLocalEdits = isDirty();
  const file = await handle.getFile();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  loadWorkbook(wb);
  markClean();
  renderAll();
  showToast(hadLocalEdits ? (t('toast_local_replaced') + handle.name) : (t('toast_file_loaded') + handle.name));
  return true;
}

async function saveToFile(){
  const wb = buildWorkbook();
  if(supportsFS && ui.fileHandle){
    try{
      const perm = await ui.fileHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        const req = await ui.fileHandle.requestPermission({mode:'readwrite'});
        if(req!=='granted'){ showToast(t('toast_no_permission')); return; }
      }
      const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
      const writable = await ui.fileHandle.createWritable();
      await writable.write(buf);
      await writable.close();
      markClean();
      showToast(t('toast_saved_to') + ui.fileHandle.name);
      return;
    }catch(e){ showToast(t('toast_save_failed')); }
  }
  XLSX.writeFile(wb, 'orcamento.xlsx');
  showToast(t('toast_downloaded'));
}

$('fileInputFallback').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const wb = XLSX.read(ev.target.result, {type:'array'});
    loadWorkbook(wb); renderAll();
    showToast(t('toast_imported') + file.name);
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
});

function updateFileInfo(){
  $('fileInfo').textContent = drive.file
    ? `Drive: ${drive.file.name}`
    : ui.fileName ? (t('file_linked') + ui.fileName) : (supportsFS ? t('file_none') : t('file_compat'));
  if(!drive.user&&!drive.file) setDriveStatus(t('drive_not_connected'));
  const btn = $('btnReconnect');
  if(ui.pendingHandle && !ui.fileName){
    btn.style.display = '';
    btn.textContent = '↻ ' + t('reconnect') + ': ' + ui.pendingHandle.name;
    btn.title = t('reconnect_title');
  } else {
    btn.style.display = 'none';
  }
}

/* ============================================================ arranque ============================================================ */
document.querySelectorAll('#pageNav button').forEach(b=>b.addEventListener('click', ()=>setPage(b.dataset.page)));
$('btnConnect').addEventListener('click', connectFile);
$('btnSave').addEventListener('click', saveToFile);
$('btnDriveSync').addEventListener('click',handleDriveSyncClick);
$('btnTheme').addEventListener('click', ()=>{
  ui.light = !ui.light;
  document.body.classList.toggle('light', ui.light);
  $('btnTheme').textContent = ui.light ? '☾' : '☀';
  renderAll();
});
$('btnLang').addEventListener('click', ()=>{
  ui.lang = ui.lang==='en' ? 'pt' : 'en';
  try{ localStorage.setItem('orcamento-lang', ui.lang); }catch(e){}
  renderAll();
});
$('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

$('btnReconnect').addEventListener('click', async ()=>{
  const handle = ui.pendingHandle;
  if(!handle) return;
  try{
    // tem de ser chamado logo no clique (o browser só deixa pedir permissão com gesto do utilizador)
    const req = await handle.requestPermission({mode:'readwrite'});
    if(req!=='granted') return;
    ui.fileHandle = handle; ui.fileName = handle.name; ui.pendingHandle = null;
    await readFromHandle(handle);
    updateFileInfo();
  }catch(e){
    ui.fileHandle = null; ui.fileName = null;
    showToast(t('toast_reconnect_failed'));
    updateFileInfo();
  }
});

(async function init(){
  updateFileInfo();
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error=>console.error('Budget offline app shell registration failed:',error));
  }
  if(supportsFS){
    const handle = await idbGet('lastHandle');
    if(handle){
      try{
        // Para ABRIR basta permissão de leitura; a de escrita só é pedida quando gravas.
        let perm = await handle.queryPermission({mode:'readwrite'});
        if(perm!=='granted') perm = await handle.queryPermission({mode:'read'});
        if(perm==='granted'){
          ui.fileHandle = handle; ui.fileName = handle.name;
          await readFromHandle(handle);
        } else {
          ui.pendingHandle = handle; // o browser voltou a pedir permissão: um clique em "Reconectar"
        }
      }catch(e){
        ui.fileHandle = null; ui.fileName = null; ui.pendingHandle = null;
        showToast(t('toast_reconnect_failed'));
      }
      updateFileInfo();
    }
  }
  setPage('dashboard');
})();
</script>
